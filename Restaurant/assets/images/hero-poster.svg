<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Candlelit ambience">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#2a1d10"/><stop offset="55%" stop-color="#150f0a"/><stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>
    <radialGradient id="soft"><stop offset="0%" stop-color="#E0A458"/><stop offset="100%" stop-color="#E0A458" stop-opacity="0"/></radialGradient>
    <radialGradient id="soft2"><stop offset="0%" stop-color="#ffd9a0"/><stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
    <radialGradient id="flame" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#ff9a3c" stop-opacity="0.5"/><stop offset="100%" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="900" rx="900" ry="420" fill="url(#flame)"/>
  <!-- bokeh -->
  <g>
    <circle cx="240" cy="220" r="120" fill="url(#soft)" opacity="0.5"/>
    <circle cx="1320" cy="300" r="160" fill="url(#soft)" opacity="0.4"/>
    <circle cx="560" cy="540" r="90" fill="url(#soft2)" opacity="0.5"/>
    <circle cx="1080" cy="620" r="200" fill="url(#soft)" opacity="0.35"/>
    <circle cx="820" cy="280" r="70" fill="url(#soft2)" opacity="0.6"/>
    <circle cx="1480" cy="700" r="110" fill="url(#soft)" opacity="0.3"/>
    <circle cx="120" cy="640" r="80" fill="url(#soft)" opacity="0.4"/>
    <circle cx="420" cy="760" r="60" fill="url(#soft2)" opacity="0.45"/>
    <circle cx="980" cy="120" r="50" fill="url(#soft2)" opacity="0.5"/>
  </g>
</svg>
