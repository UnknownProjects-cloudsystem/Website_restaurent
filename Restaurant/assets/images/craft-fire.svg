<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="The open fire of the kitchen">
  <defs>
    <radialGradient id="bg" cx="50%" cy="78%" r="80%">
      <stop offset="0%" stop-color="#3a1d0c"/><stop offset="45%" stop-color="#1c1008"/><stop offset="100%" stop-color="#0b0806"/>
    </radialGradient>
    <linearGradient id="f1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#8a2a0e"/><stop offset="45%" stop-color="#E0A458"/><stop offset="100%" stop-color="#ffe39c"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b23c12"/><stop offset="60%" stop-color="#e8954a"/><stop offset="100%" stop-color="#fff0c0"/>
    </linearGradient>
    <radialGradient id="emberglow" cx="50%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#ff7a1f" stop-opacity="0.55"/><stop offset="100%" stop-color="#ff7a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <ellipse cx="200" cy="430" rx="240" ry="150" fill="url(#emberglow)"/>

  <!-- flames -->
  <g opacity="0.96">
    <path d="M200 430 C150 380 160 320 196 262 C206 300 224 312 220 350 C246 318 250 280 238 244 C276 300 286 366 252 420 Z" fill="url(#f1)"/>
    <path d="M150 432 C120 392 128 350 156 312 C162 342 178 352 174 382 C196 356 198 326 188 300 C220 344 226 396 196 432 Z" fill="url(#f2)" opacity="0.85"/>
    <path d="M252 432 C232 398 238 360 264 326 C268 352 282 360 280 386 C298 362 300 338 292 316 C320 354 322 398 296 432 Z" fill="url(#f2)" opacity="0.8"/>
    <path d="M200 424 C182 396 188 366 206 338 C212 360 224 366 222 388 C238 366 240 346 232 328 C254 358 256 396 232 424 Z" fill="#fff2cf" opacity="0.7"/>
  </g>

  <!-- grill grate -->
  <g stroke="#0a0705" stroke-width="9" stroke-linecap="round" opacity="0.92">
    <line x1="64" y1="436" x2="336" y2="436"/><line x1="58" y1="456" x2="342" y2="456"/><line x1="54" y1="476" x2="346" y2="476"/>
  </g>
  <g stroke="#1a1410" stroke-width="5" opacity="0.6">
    <line x1="110" y1="426" x2="110" y2="486"/><line x1="170" y1="426" x2="170" y2="486"/><line x1="230" y1="426" x2="230" y2="486"/><line x1="290" y1="426" x2="290" y2="486"/>
  </g>

  <!-- sparks -->
  <g fill="#ffd08a">
    <circle cx="150" cy="250" r="2"/><circle cx="240" cy="210" r="1.6"/><circle cx="200" cy="180" r="1.8"/>
    <circle cx="120" cy="300" r="1.5"/><circle cx="280" cy="280" r="1.7"/><circle cx="260" cy="160" r="1.4"/>
    <circle cx="180" cy="220" r="1.3"/><circle cx="300" cy="330" r="1.5"/><circle cx="100" cy="360" r="1.4"/>
  </g>
</svg>
