<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" role="img" aria-label="Oscietra caviar service">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#2a1d12"/><stop offset="55%" stop-color="#160f0a"/><stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>
    <radialGradient id="plate" cx="44%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#3a2f24"/><stop offset="55%" stop-color="#241a11"/><stop offset="88%" stop-color="#14100b"/><stop offset="100%" stop-color="#2a2016"/>
    </radialGradient>
    <radialGradient id="platespec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1d0" stop-opacity="0.5"/><stop offset="100%" stop-color="#fff1d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tin" cx="50%" cy="36%" r="64%">
      <stop offset="0%" stop-color="#4a515b"/><stop offset="55%" stop-color="#2a313a"/><stop offset="100%" stop-color="#11161c"/>
    </radialGradient>
    <radialGradient id="dome" cx="42%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#7b818f" stop-opacity="0.55"/><stop offset="45%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="pearlspoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ea"/><stop offset="40%" stop-color="#dfe6ea"/><stop offset="62%" stop-color="#e9d4e6"/><stop offset="100%" stop-color="#b9c2ad"/>
    </linearGradient>
    <!-- single caviar pearl: dark sphere + highlight -->
    <radialGradient id="pearl" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#4a4d57"/><stop offset="45%" stop-color="#23252c"/><stop offset="100%" stop-color="#0f1014"/>
    </radialGradient>
    <pattern id="roe" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="4.3" fill="url(#pearl)"/><circle cx="3" cy="3" r="1.1" fill="#aeb2c0" opacity="0.85"/>
      <circle cx="10.5" cy="10.5" r="4.1" fill="url(#pearl)"/><circle cx="9.2" cy="9.2" r="1" fill="#9da1b0" opacity="0.8"/>
      <circle cx="11" cy="3.5" r="2.4" fill="url(#pearl)"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="mound"><ellipse cx="232" cy="300" rx="86" ry="62"/></clipPath>
  </defs>

  <rect width="480" height="600" fill="url(#bg)"/>

  <!-- plate -->
  <ellipse cx="240" cy="318" rx="196" ry="158" fill="#0c0805"/>
  <ellipse cx="240" cy="310" rx="186" ry="150" fill="url(#plate)"/>
  <ellipse cx="186" cy="248" rx="120" ry="64" fill="url(#platespec)" filter="url(#soft)" opacity="0.5"/>
  <ellipse cx="240" cy="310" rx="186" ry="150" fill="none" stroke="#C9A24B" stroke-width="1.6" stroke-opacity="0.45"/>
  <ellipse cx="240" cy="310" rx="150" ry="118" fill="none" stroke="#000" stroke-width="1" stroke-opacity="0.25"/>

  <!-- contact shadow -->
  <ellipse cx="240" cy="356" rx="120" ry="48" fill="#000" opacity="0.5" filter="url(#soft)"/>

  <!-- blini under tin -->
  <ellipse cx="232" cy="332" rx="104" ry="44" fill="#cf9f5e"/>
  <ellipse cx="232" cy="328" rx="98" ry="40" fill="#e0b878"/>
  <ellipse cx="200" cy="318" rx="28" ry="9" fill="#f0d49a" opacity="0.6" filter="url(#soft2)"/>

  <!-- caviar tin -->
  <ellipse cx="232" cy="306" rx="98" ry="72" fill="#0d1015"/>
  <ellipse cx="232" cy="300" rx="92" ry="66" fill="url(#tin)" stroke="#C9A24B" stroke-width="1.6" stroke-opacity="0.5"/>
  <ellipse cx="190" cy="268" rx="44" ry="20" fill="#cfd6df" opacity="0.18" filter="url(#soft)"/>

  <!-- roe mound -->
  <g clip-path="url(#mound)">
    <rect x="146" y="238" width="172" height="124" fill="#15161b"/>
    <rect x="146" y="238" width="172" height="124" fill="url(#roe)"/>
    <rect x="146" y="238" width="172" height="124" fill="url(#dome)"/>
  </g>
  <!-- glossy top sheen on mound -->
  <ellipse cx="206" cy="278" rx="34" ry="14" fill="#cdd2dd" opacity="0.28" filter="url(#soft2)"/>

  <!-- crème fraîche quenelle -->
  <g><ellipse cx="276" cy="288" rx="20" ry="13" fill="#f5f1e6"/><ellipse cx="276" cy="284" rx="20" ry="9" fill="#fffdf6"/><ellipse cx="269" cy="281" rx="7" ry="3" fill="#fff" opacity="0.9"/></g>
  <!-- chives -->
  <g stroke="#7e9a52" stroke-width="2.2" stroke-linecap="round"><line x1="266" y1="276" x2="286" y2="268"/><line x1="272" y1="274" x2="292" y2="274"/></g>

  <!-- mother-of-pearl spoon -->
  <g transform="rotate(30 352 244)">
    <ellipse cx="352" cy="244" rx="36" ry="24" fill="url(#pearlspoon)" stroke="#9aa089" stroke-width="1.4"/>
    <ellipse cx="343" cy="236" rx="13" ry="7" fill="#fff" opacity="0.6"/>
    <rect x="350" y="239" width="104" height="9" rx="4.5" fill="url(#pearlspoon)" stroke="#9aa089" stroke-width="0.8"/>
    <!-- a few pearls in the bowl -->
    <g><circle cx="352" cy="248" r="4" fill="url(#pearl)"/><circle cx="360" cy="244" r="3.6" fill="url(#pearl)"/><circle cx="346" cy="244" r="3.6" fill="url(#pearl)"/></g>
  </g>

  <!-- stray pearls -->
  <g><circle cx="150" cy="356" r="4.2" fill="url(#pearl)"/><circle cx="161" cy="362" r="3.6" fill="url(#pearl)"/><circle cx="318" cy="352" r="4" fill="url(#pearl)"/></g>

  <radialGradient id="vig" cx="50%" cy="46%" r="62%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity="0.55"/></radialGradient>
  <rect width="480" height="600" fill="url(#vig)"/>
</svg>
